  <section id="grid">
    <h2><span class="kicker">1</span>Bayes on a grid</h2>
    <aside class="a-margin"><b>In this section.</b> Start from a prior \(p(\theta)\), multiply by the likelihood \(p(y \mid \theta)\), normalize, and get the posterior \(p(\theta \mid y)\). Here the answer is exact.</aside>
    <p>
      Laplace asked whether a birth is more likely to be a boy.<span class="sn-mark"></span><span class="sidenote">Carpenter §5. The counts are Laplace's live births in Paris, 1745 to 1770.</span>
      Let \(\theta\) be that probability. The data are \(y\) boys out of \(n\) births, so the likelihood is
      <a class="ext" href="https://en.wikipedia.org/wiki/Binomial_distribution">binomial</a>. With a \(\Beta(a, b)\) prior the posterior is again a Beta,<span class="sn-mark"></span><span class="sidenote">This is what <a class="ext" href="https://en.wikipedia.org/wiki/Conjugate_prior">conjugate</a> means: prior and posterior come from the same family.</span>
      which gives an exact answer to check everything else against:
    </p>
    <div class="eq">\[ p(\theta \mid y) \;\propto\; \underbrace{\theta^{a-1} (1-\theta)^{b-1}}_{\text{prior}} \cdot \underbrace{\theta^{y} (1-\theta)^{n-y}}_{\text{likelihood}} \;=\; \Beta(a + y,\ b + n - y) \]</div>
    <p>
      With one parameter you can also skip the algebra: evaluate prior × likelihood on a fine grid of \(\theta\) values and divide by
      the sum. Figure 1 does both, and the two agree.
    </p>
    <figure class="a-wide">
      <div class="a-figctl">
        <label class="ctl">prior a <input type="range" id="c-a" min="0.5" max="50" step="0.5" value="1" /><output data-o="a"></output></label>
        <label class="ctl">prior b <input type="range" id="c-b" min="0.5" max="50" step="0.5" value="1" /><output data-o="b"></output></label>
        <label class="ctl">share of Laplace's data <input type="range" id="c-frac" min="-4" max="0" step="0.25" value="-3" /><output data-o="frac"></output></label>
      </div>
      <div class="a-panels">
        <div class="plot" id="p-grid"></div>
        <div class="plot" id="p-summary"></div>
      </div>
      <figcaption>
        <b>Prior × likelihood → posterior.</b> Left: the dots are the grid approximation and the line is the exact Beta; the likelihood is
        scaled to fit the same axis. Right: the posterior, with its central 95% interval shaded. Raise the prior sliders, then slide the
        data share to 100%. Now: <span class="r" data-r="births"></span> births, posterior mean <span class="r" data-r="mean"></span>
        (sd <span class="r" data-r="sd"></span>), 95% interval <span class="r" data-r="ci"></span>,
        P(θ ≤ ½) = <span class="r" data-r="phalf"></span>.
      </figcaption>
    </figure>
    <p class="a-key">
      <b>Data overwhelm the prior.</b> With 0.01% of the data, about 20 births, the prior sliders move the posterior a lot. With all of it,
      no reasonable prior matters: \(P(\theta \le \tfrac12)\) drops to about \(10^{-42}\). That is Laplace's answer.
    </p>
    <p>
      The grid works because there is only one parameter. With \(d\) parameters a grid needs \(400^d\) points, which is why the rest
      of the page uses samples.
    </p>
  </section>

  <section id="toy">
    <h2><span class="kicker">3</span>The toy problem: friends and strangers</h2>
    <p class="omitted">§2, Monte Carlo, is left out of the prototype.</p>
    <aside class="a-margin"><b>In this section.</b> Draw a hidden label \(z_i\), then a count \(x_i\); you only see \(x\). The rest of the page infers \(\lambda_0, \lambda_1, \rho\) and every \(z_i\).</aside>
    <p>
      You have \(N\) counts, each one how often a pair of animals was seen together.<span class="sn-mark"></span><span class="sidenote">This is the dolphin model of Young et al. §3.1 with the network taken away.</span>
      A pair is either <strong>strangers</strong>, who meet by chance about \(\lambda_0\) times, or <strong>friends</strong>, who meet
      about \(\lambda_1\) times. A share \(\rho\) of the pairs are friends. The hidden label \(z_i\) says which kind pair \(i\) is:
    </p>
    <div class="eq">\[ \begin{aligned}
  z_i &amp;\sim \Bernoulli(\rho) &amp;&amp; \text{is pair } i \text{ friends? (hidden)} \\
  x_i \mid z_i &amp;\sim \Poisson(\lambda_{z_i}) &amp;&amp; \text{how often they were seen together}
\end{aligned} \]</div>
    <p>
      From the counts alone, find \(\theta = (\lambda_0, \lambda_1, \rho)\) and, for each pair, \(P(z_i = 1 \mid x)\). The strip above
      Figure 2 sets the true values used to simulate the counts. The samplers never see them, so you can check what they recover.
    </p>

      <p class="c-reading">Reading: Carpenter §5.</p>
    </section>

    <section id="toy">
      <h2><span class="c-num">3</span>The toy problem: friends and strangers</h2>
      <p class="omitted">§2, Monte Carlo, is left out of the prototype.</p>
      <p>
        You have \(N\) counts, each one how often a pair of animals was seen together. A pair is either <strong>strangers</strong>, who meet by
        chance about \(\lambda_0\) times, or <strong>friends</strong>, who meet about \(\lambda_1\) times. A share \(\rho\) of the pairs are friends.
      </p>
      <div class="box model">
        <span class="box-label">The model</span>
        <div class="eq">\[ \begin{aligned}
  z_i &amp;\sim \Bernoulli(\rho) &amp;&amp; \text{hidden} \\
  x_i \mid z_i &amp;\sim \Poisson(\lambda_{z_i}) &amp;&amp; \text{observed}
\end{aligned} \]</div>
      </div>
      <figure class="c-fig">
        <div class="plot" id="p-toy"></div>
        <figcaption><b>What you observe.</b> The counts with no labels: which come from friends is exactly what you can't see.</figcaption>
      </figure>
      <div class="box try">
        <span class="box-label">Try it</span>

          <label class="ctl">λ₁ <input type="range" data-k="l1" min="2" max="30" step="0.5" /><output></output></label>
          <label class="ctl">ρ <input type="range" data-k="rho" min="0.05" max="0.8" step="0.01" /><output></output></label>
          <label class="ctl">N <input type="range" data-k="N" min="20" max="500" step="10" /><output></output></label>
          <button type="button" data-act="seed">New sample</button>
          <button type="button" data-act="dolphin">Dolphin-like</button>
        </div>
        <p class="status-line" data-r="toy-status"></p>
      </div>
      <div class="box key">
        <span class="box-label">Key idea</span>
        <p>\(z\) is discrete, so the samplers never touch it. §4 and §5 use the likelihood with \(z\)
        <a href="#" title="Concept page: marginalization (stub)">summed out</a> and recover the \(z\)'s afterwards.</p>
      </div>
      <p class="c-reading">Reading: Young et al. §3.1.</p>

    <section id="mcmc">
      <h2><span class="c-num">4</span>When you can't draw directly: Metropolis vs. HMC</h2>

        from it, but a <a href="#" title="Concept page: Markov chain Monte Carlo (stub)">Markov chain</a> can walk it.
      </p>

<!-- Mount the chosen variant before MathJax typesets the page, then add the prototype switcher. -->
<script>
(() => {
  const KEYS = ["A", "B", "C"];
  const NAMES = { A: "Margin notes", B: "Wide figures, controls beside", C: "Textbook boxes" };
  const q = new URLSearchParams(location.search);
  let v = (q.get("variant") || "A").toUpperCase();
  if (!KEYS.includes(v)) v = "A";
  document.body.classList.add(`v-${v}`);
  document.getElementById("root").appendChild(document.getElementById(`variant-${v}`).content.cloneNode(true));

  const go = (d) => { q.set("variant", KEYS[(KEYS.indexOf(v) + d + KEYS.length) % KEYS.length]); location.search = q.toString(); };
  const bar = document.createElement("div");
  bar.className = "proto-bar";
  bar.innerHTML = `<button type="button" aria-label="Previous variant">←</button><span class="proto-label"><small>Prototype</small>${v}, ${NAMES[v]}</span><button type="button" aria-label="Next variant">→</button>`;
  const [prev, next] = bar.querySelectorAll("button");
  prev.onclick = () => go(-1);
  next.onclick = () => go(1);
  document.body.appendChild(bar);
  addEventListener("keydown", (e) => {
    const t = document.activeElement;
    if (t && (t.matches("input, textarea, select") || t.isContentEditable)) return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  // B's contents rail marks the section in view
  const links = [...document.querySelectorAll(".b-rail a")];
  if (links.length) {
    const obs = new IntersectionObserver((es) => {
      for (const e of es) if (e.isIntersecting) links.forEach((a) => a.classList.toggle("active", a.getAttribute("href") === `#${e.target.id}`));
    }, { rootMargin: "-40% 0px -55% 0px" });
    document.querySelectorAll("section, header").forEach((s) => obs.observe(s));
  }
})();
</script>
<script type="module" src="js/prototype-anatomy.js"></script>
</body>
